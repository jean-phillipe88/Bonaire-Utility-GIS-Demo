        <style>
        html, body {
            background-color: #ffffff;

        /* Digital LCD Meter styling */
.digital-meter-container {
    background-color: #151d1a;
    border: 3px solid #3a4440;
    border-radius: 4px;
    padding: 8px;
    box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
    font-family: 'Courier New', Courier, monospace; /* Emulates digital font */
    color: #39ff14; /* Neon green LED glow */
    text-shadow: 0 0 8px rgba(57, 255, 20, 0.6);
    text-align: center;
    margin: 5px 0;
}

.digital-meter-label {
    font-size: 10px;
    text-transform: uppercase;
    color: #8da499;
    letter-spacing: 1px;
    margin-bottom: 4px;
}

.digital-meter-value {
    font-size: 22px;
    font-weight: bold;
    letter-spacing: 2px;
}

.digital-meter-unit {
    font-size: 12px;
    color: #26b10f;
    margin-left: 4px;
}

        .ol-control > * {
            background-color: #f8f8f8!important;
            color: #444444!important;
            border-radius: 0px;
        }
        .ol-attribution a, .gcd-gl-input::placeholder, .search-layer-input-search::placeholder {
            color: #444444!important;
        }
        .search-layer-input-search {
            background-color: #f8f8f8!important;
        }
        .ol-control > *:focus, .ol-control >*:hover {
            background-color: rgba(248, 248, 248, 0.7)!important;
        } 
        .ol-control {
            background-color: rgba(255,255,255,.4) !important;
            padding: 2px !important;
        } 
        </style>
